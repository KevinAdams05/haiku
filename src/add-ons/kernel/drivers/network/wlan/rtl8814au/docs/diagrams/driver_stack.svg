<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 860" font-family="Noto Sans, Inter, sans-serif">
  <defs>
    <style>
      .title { font-size: 17px; fill: #1a1a2e; font-weight: 700; text-anchor: middle; }
      .subtitle { font-size: 11px; fill: #6c757d; text-anchor: middle; font-style: italic; }
      .box-haiku { fill: #e8f4fd; stroke: #1565c0; stroke-width: 2; rx: 8; }
      .box-driver { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 8; }
      .box-hw { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 8; }
      .box-sub { fill: #f5f5f5; stroke: #9e9e9e; stroke-width: 1.5; rx: 6; }
      .lbl { font-size: 13px; fill: #212529; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
      .lbl-sm { font-size: 10.5px; fill: #495057; text-anchor: middle; dominant-baseline: central; }
      .lbl-api { font-size: 10px; fill: #1565c0; text-anchor: middle; dominant-baseline: central; font-family: monospace; }
      .arrow { stroke: #495057; stroke-width: 2; marker-end: url(#ah); }
      .arrow-data { stroke: #2e7d32; stroke-width: 2; marker-end: url(#ah-grn); stroke-dasharray: 6,3; }
      .section { font-size: 11px; fill: #9e9e9e; font-weight: 700; letter-spacing: 1px; }
      .note { font-size: 10px; fill: #6c757d; font-style: italic; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#495057"/>
    </marker>
    <marker id="ah-grn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="390" y="28" class="title">RTL8814AU Native Haiku Driver — Full Stack Architecture</text>
  <text x="390" y="46" class="subtitle">No FreeBSD compatibility layer — pure Haiku kernel APIs</text>

  <!-- === HAIKU LAYER === -->
  <text x="30" y="80" class="section">HAIKU OS</text>

  <!-- Userland apps -->
  <rect x="150" y="68" width="210" height="38" class="box-haiku"/>
  <text x="255" y="82" class="lbl">User Applications</text>
  <text x="255" y="95" class="lbl-sm">Network Kit / ifconfig / ping</text>

  <rect x="420" y="68" width="210" height="38" class="box-haiku"/>
  <text x="525" y="82" class="lbl">Network Preferences</text>
  <text x="525" y="95" class="lbl-sm">WiFi SSID / password UI</text>

  <!-- Network stack -->
  <rect x="120" y="130" width="540" height="50" class="box-haiku"/>
  <text x="390" y="148" class="lbl">Haiku Network Stack</text>
  <text x="390" y="164" class="lbl-api">net_device_module_info — send_data() / receive_data() / control()</text>

  <line x1="255" y1="106" x2="255" y2="128" class="arrow"/>
  <line x1="525" y1="106" x2="525" y2="128" class="arrow"/>

  <!-- === DRIVER LAYER === -->
  <text x="30" y="210" class="section">OUR DRIVER</text>

  <!-- Main driver box -->
  <rect x="60" y="200" width="660" height="390" class="box-driver" fill-opacity="0.15"/>

  <!-- Driver core -->
  <rect x="200" y="215" width="370" height="40" class="box-driver"/>
  <text x="385" y="229" class="lbl">RTL8814AU Driver Core</text>
  <text x="385" y="243" class="lbl-sm">init / open / close / control dispatch</text>

  <line x1="390" y1="180" x2="390" y2="213" class="arrow"/>
  <text x="392" y="198" class="lbl-api">ETHER_* ioctls</text>

  <!-- Sub-modules row 1 -->
  <rect x="80" y="275" width="175" height="55" class="box-sub"/>
  <text x="167" y="293" class="lbl">WiFi Management</text>
  <text x="167" y="307" class="lbl-sm">Scan / Associate / Auth</text>
  <text x="167" y="319" class="lbl-sm">(firmware-assisted MLME)</text>

  <rect x="275" y="275" width="115" height="55" class="box-sub"/>
  <text x="332" y="293" class="lbl">TX Path</text>
  <text x="332" y="307" class="lbl-sm">Build TX desc</text>
  <text x="332" y="319" class="lbl-sm">→ USB bulk out</text>

  <rect x="410" y="275" width="115" height="55" class="box-sub"/>
  <text x="467" y="293" class="lbl">RX Path</text>
  <text x="467" y="307" class="lbl-sm">USB bulk in →</text>
  <text x="467" y="319" class="lbl-sm">Parse RX desc</text>

  <rect x="545" y="275" width="155" height="55" class="box-sub"/>
  <text x="622" y="293" class="lbl">H2C / C2H</text>
  <text x="622" y="307" class="lbl-sm">Host ↔ Firmware</text>
  <text x="622" y="319" class="lbl-sm">command mailbox</text>

  <!-- Connectors from core to row 1 -->
  <line x1="295" y1="255" x2="167" y2="273" class="arrow"/>
  <line x1="350" y1="255" x2="332" y2="273" class="arrow"/>
  <line x1="420" y1="255" x2="467" y2="273" class="arrow"/>
  <line x1="480" y1="255" x2="622" y2="273" class="arrow"/>

  <!-- Sub-modules row 2 -->
  <rect x="80" y="350" width="175" height="55" class="box-sub"/>
  <text x="167" y="368" class="lbl">Firmware Loader</text>
  <text x="167" y="382" class="lbl-sm">DMEM + IRAM sections</text>
  <text x="167" y="394" class="lbl-sm">via internal DMA engine</text>

  <rect x="275" y="350" width="250" height="55" class="box-sub"/>
  <text x="400" y="368" class="lbl">PHY / RF Engine</text>
  <text x="400" y="382" class="lbl-sm">4-path (A/B/C/D) calibration, IQ cal,</text>
  <text x="400" y="394" class="lbl-sm">power tracking, DIG, rate adaptation</text>

  <rect x="545" y="350" width="155" height="55" class="box-sub"/>
  <text x="622" y="368" class="lbl">EFUSE / EEPROM</text>
  <text x="622" y="382" class="lbl-sm">MAC addr, TX power</text>
  <text x="622" y="394" class="lbl-sm">tables, antenna config</text>

  <!-- Sub-modules row 3: HAL -->
  <rect x="120" y="425" width="530" height="45" class="box-sub"/>
  <text x="385" y="441" class="lbl">Hardware Abstraction — Register I/O</text>
  <text x="385" y="457" class="lbl-sm">ReadRegister8/16/32() — WriteRegister8/16/32() — via USB vendor control transfers</text>

  <!-- Connectors row1 → row2 and row2 → HAL -->
  <line x1="167" y1="330" x2="167" y2="348" class="arrow"/>
  <line x1="400" y1="330" x2="400" y2="348" class="arrow"/>
  <line x1="622" y1="330" x2="622" y2="348" class="arrow"/>
  <line x1="167" y1="405" x2="250" y2="423" class="arrow"/>
  <line x1="400" y1="405" x2="400" y2="423" class="arrow"/>
  <line x1="622" y1="405" x2="520" y2="423" class="arrow"/>

  <!-- USB transfer layer -->
  <rect x="120" y="490" width="530" height="45" class="box-sub"/>
  <text x="385" y="506" class="lbl">USB Transfer Manager</text>
  <text x="385" y="522" class="lbl-sm">Async bulk IN/OUT queues — interrupt endpoint — semaphore signaling</text>

  <line x1="385" y1="470" x2="385" y2="488" class="arrow"/>

  <!-- Connectors: TX/RX direct to USB -->
  <line x1="332" y1="330" x2="280" y2="488" class="arrow-data"/>
  <line x1="467" y1="330" x2="490" y2="488" class="arrow-data"/>

  <!-- === HAIKU USB LAYER === -->
  <text x="30" y="565" class="section">HAIKU USB</text>

  <rect x="120" y="555" width="530" height="45" class="box-haiku"/>
  <text x="385" y="571" class="lbl">Haiku USB Bus Manager v3.1</text>
  <text x="385" y="587" class="lbl-api">queue_bulk() / queue_interrupt() / send_request()</text>

  <line x1="385" y1="535" x2="385" y2="553" class="arrow"/>
  <text x="387" y="546" class="lbl-api">USB3.h</text>

  <!-- xHCI -->
  <rect x="230" y="620" width="310" height="38" class="box-haiku"/>
  <text x="385" y="633" class="lbl">xHCI Host Controller Driver</text>
  <text x="385" y="647" class="lbl-sm">Intel 100/700 Series USB 3.0/3.2</text>

  <line x1="385" y1="600" x2="385" y2="618" class="arrow"/>

  <!-- === HARDWARE LAYER === -->
  <text x="30" y="690" class="section">HARDWARE</text>

  <!-- USB cable -->
  <rect x="310" y="675" width="150" height="28" fill="#e0e0e0" stroke="#9e9e9e" rx="4"/>
  <text x="385" y="689" class="lbl-sm" font-weight="600">USB 3.0 Cable</text>

  <line x1="385" y1="658" x2="385" y2="673" class="arrow"/>

  <!-- RTL8814AU chip -->
  <rect x="100" y="720" width="580" height="120" class="box-hw" fill-opacity="0.2"/>
  <rect x="100" y="720" width="580" height="30" class="box-hw"/>
  <text x="390" y="738" class="lbl" fill="#fff">RTL8814AU SoC — Realtek</text>

  <line x1="385" y1="703" x2="385" y2="718" class="arrow"/>

  <!-- Internal blocks -->
  <rect x="115" y="760" width="100" height="35" fill="#fff3e0" stroke="#e65100" rx="4"/>
  <text x="165" y="772" class="lbl-sm" font-weight="600">Lexra 3081</text>
  <text x="165" y="785" class="lbl-sm">MIPS CPU</text>

  <rect x="230" y="760" width="100" height="35" fill="#fff3e0" stroke="#e65100" rx="4"/>
  <text x="280" y="772" class="lbl-sm" font-weight="600">MAC Engine</text>
  <text x="280" y="785" class="lbl-sm">TX/RX DMA</text>

  <rect x="345" y="760" width="100" height="35" fill="#fff3e0" stroke="#e65100" rx="4"/>
  <text x="395" y="772" class="lbl-sm" font-weight="600">Baseband</text>
  <text x="395" y="785" class="lbl-sm">PHY / ADC / DAC</text>

  <rect x="460" y="760" width="100" height="35" fill="#fff3e0" stroke="#e65100" rx="4"/>
  <text x="510" y="772" class="lbl-sm" font-weight="600">4× RF</text>
  <text x="510" y="785" class="lbl-sm">A / B / C / D</text>

  <rect x="575" y="760" width="90" height="35" fill="#fff3e0" stroke="#e65100" rx="4"/>
  <text x="620" y="772" class="lbl-sm" font-weight="600">EFUSE</text>
  <text x="620" y="785" class="lbl-sm">1024 bytes</text>

  <!-- Antenna symbols -->
  <line x1="470" y1="810" x2="470" y2="835" stroke="#e65100" stroke-width="2"/>
  <line x1="460" y1="835" x2="480" y2="835" stroke="#e65100" stroke-width="2"/>
  <line x1="455" y1="840" x2="485" y2="840" stroke="#e65100" stroke-width="1.5"/>
  <line x1="460" y1="845" x2="480" y2="845" stroke="#e65100" stroke-width="1"/>

  <line x1="490" y1="810" x2="490" y2="835" stroke="#e65100" stroke-width="2"/>
  <line x1="480" y1="835" x2="500" y2="835" stroke="#e65100" stroke-width="2"/>
  <line x1="475" y1="840" x2="505" y2="840" stroke="#e65100" stroke-width="1.5"/>
  <line x1="480" y1="845" x2="500" y2="845" stroke="#e65100" stroke-width="1"/>

  <line x1="520" y1="810" x2="520" y2="835" stroke="#e65100" stroke-width="2"/>
  <line x1="510" y1="835" x2="530" y2="835" stroke="#e65100" stroke-width="2"/>
  <line x1="505" y1="840" x2="535" y2="840" stroke="#e65100" stroke-width="1.5"/>
  <line x1="510" y1="845" x2="530" y2="845" stroke="#e65100" stroke-width="1"/>

  <line x1="550" y1="810" x2="550" y2="835" stroke="#e65100" stroke-width="2"/>
  <line x1="540" y1="835" x2="560" y2="835" stroke="#e65100" stroke-width="2"/>
  <line x1="535" y1="840" x2="565" y2="840" stroke="#e65100" stroke-width="1.5"/>
  <line x1="540" y1="845" x2="560" y2="845" stroke="#e65100" stroke-width="1"/>

  <text x="510" y="858" class="note">4× MIMO Antennas (2.4 GHz + 5 GHz dual-band)</text>
</svg>